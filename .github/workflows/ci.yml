name: CI

on:
  push:
    branches: ["main", "upgrade/*"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history: verify-source diffs against the phase base commit
          # (8c67f16326299bff283dbec1468c910105406eb3).
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # >=22.18 is required for type stripping of .ts imports (design assumption A4).
          node-version: '^22.18.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Scan for unmasked secrets and credentials
        run: node scripts/check-secrets.js --all

      - name: Type-check Astro & TypeScript
        run: npm run check

      - name: Run logic tests
        if: ${{ hashFiles('tests/logic/**/*.test.mjs') != '' }}
        run: npm run test:logic

      - name: Verify source rules
        run: npm run verify:source -- --strict

      - name: Build static site
        run: npm run build

      - name: Verify built output
        run: npm run verify:dist
